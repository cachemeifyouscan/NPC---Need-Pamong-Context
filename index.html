<style>

/* =====================================================
   OPENING SCREEN
===================================================== */

#intro-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 99999;

    background:

        /* soft parchment center */
        radial-gradient(
            ellipse at center,
            rgba(255, 252, 240, 0.98) 0%,
            rgba(247, 238, 218, 0.96) 48%,
            rgba(225, 207, 174, 0.98) 100%
        );

}


/* =====================================================
   PARchMENT TEXTURE
===================================================== */

#intro-screen::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: 0.35;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(100, 75, 40, 0.025) 0px,
            rgba(100, 75, 40, 0.025) 1px,
            transparent 1px,
            transparent 5px
        ),

        repeating-linear-gradient(
            90deg,
            rgba(100, 75, 40, 0.018) 0px,
            rgba(100, 75, 40, 0.018) 1px,
            transparent 1px,
            transparent 7px
        );

    z-index: 1;

}


/* =====================================================
   MAP DECORATION
===================================================== */

#intro-screen::after {

    content: "";

    position: absolute;

    inset: 35px;

    border: 2px solid rgba(116, 91, 54, 0.14);

    border-radius: 18px;

    pointer-events: none;

    z-index: 2;

}


/* =====================================================
   FAINT MAP LINES
===================================================== */

.map-decoration {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;

    opacity: 0.16;

}


/* =====================================================
   MAP SVG
===================================================== */

.map-decoration svg {

    width: 100%;
    height: 100%;

}


/* =====================================================
   INTRO CONTENT
===================================================== */

.intro-content {

    position: relative;

    z-index: 10;

    width: min(88vw, 720px);

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =====================================================
   MASCOT
===================================================== */

.intro-mascot {

    display: block;

    width: 100%;

    height: auto;

    margin: 0;

    user-select: none;

    -webkit-user-drag: none;

    filter:

        drop-shadow(
            0 22px 20px rgba(70, 48, 22, 0.22)
        );

    animation:

        mascotFloat
        4s
        ease-in-out
        infinite;

}


/* =====================================================
   FLOATING
===================================================== */

@keyframes mascotFloat {

    0% {

        transform:
            translateY(0px);

    }

    50% {

        transform:
            translateY(-10px);

    }

    100% {

        transform:
            translateY(0px);

    }

}


/* =====================================================
   INVISIBLE CLICK AREA
===================================================== */

#intro-start-button {

    position: absolute;

    /*
       Tombol di dalam mascot2.png
    */

    left: 27%;

    bottom: 2%;

    width: 46%;

    height: 14%;


    padding: 0;
    margin: 0;


    /*
       BENAR-BENAR TRANSPARAN
    */

    background: transparent !important;

    border: none !important;

    box-shadow: none !important;

    outline: none !important;


    cursor: pointer;

    z-index: 50;

}


/* =====================================================
   REMOVE ALL BUTTON VISUALS
===================================================== */

#intro-start-button:hover,
#intro-start-button:focus,
#intro-start-button:active {

    background: transparent !important;

    border: none !important;

    box-shadow: none !important;

    outline: none !important;

}


/* =====================================================
   MAIN GAME
===================================================== */

#main-game {

    display: none;

    min-height: 100vh;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .intro-content {

        width: 94vw;

    }


    #intro-start-button {

        left: 25%;

        width: 50%;

        bottom: 2%;

        height: 15%;

    }

}

</style>
