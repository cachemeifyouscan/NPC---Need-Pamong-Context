<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NPC — Need Pamong Context</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

button,
input{
    font:inherit;
}


/* =========================================================
   OPENING SCREEN
========================================================= */

#intro-screen{

    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:

        radial-gradient(
            circle at 50% 48%,
            rgba(255,249,222,.96),
            rgba(235,215,174,.98) 62%,
            #c8a66c 100%
        );

    z-index:100000;

    transition:
        opacity .7s ease,
        visibility .7s ease;
}

#intro-screen.hide{

    opacity:0;
    visibility:hidden;
    pointer-events:none;
}


/* =========================================================
   OLD MAP BACKGROUND
========================================================= */

.intro-map{

    position:absolute;
    inset:0;

    opacity:.38;

    pointer-events:none;
}

.intro-map svg{

    width:100%;
    height:100%;
}


/* map labels */

.map-label{

    fill:#71512b;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    letter-spacing:4px;

    font-size:19px;
}

.map-title{

    font-size:29px;

    font-weight:bold;

    letter-spacing:8px;
}


/* =========================================================
   MAP TEXTURES
========================================================= */

#intro-screen::before{

    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(72,43,15,.025) 0 1px,
            transparent 1px 5px
        ),

        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(65,38,13,.27) 100%
        );
}


/* =========================================================
   INTRO CONTENT
========================================================= */

.intro-content{

    position:relative;

    z-index:10;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* =========================================================
   MASCOT
========================================================= */

.intro-mascot{

    position:absolute;

    width:min(520px,54vw);

    max-height:67vh;

    object-fit:contain;

    user-select:none;

    -webkit-user-drag:none;

    filter:

        drop-shadow(
            0 18px 18px
            rgba(60,38,14,.20)
        );

    animation:

        mascotFloat
        4.5s
        ease-in-out
        infinite;
}


@keyframes mascotFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-11px);
    }

}


/* =========================================================
   CLICK HERE
========================================================= */

#intro-start-button{

    position:absolute;

    left:50%;

    /*
       Sedikit naik supaya dekat mascot
       tapi tidak menutupi tombol bawaan mascot.
    */

    bottom:13%;

    transform:translateX(-50%);

    width:230px;
    height:58px;

    border:0;

    background:transparent;

    cursor:pointer;

    z-index:20;

    color:transparent;
}


/*
   Visual button
*/

#intro-start-button::before{

    content:"CLICK HERE";

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border:

        2px solid
        #6d4724;

    border-radius:6px;

    background:

        repeating-linear-gradient(
            8deg,
            rgba(255,220,145,.08) 0 2px,
            rgba(45,23,8,.08) 3px 7px
        ),

        linear-gradient(
            #80552d,
            #60391e
        );

    color:#f6dfad;

    font-family:
        Cinzel,
        Georgia,
        serif;

    font-size:16px;

    font-weight:700;

    letter-spacing:2px;

    text-shadow:
        1px 1px 0 #2c1709;

    box-shadow:

        inset
        0 2px 0
        rgba(255,226,164,.25),

        0 4px 0
        #2c180b,

        0 10px 18px
        rgba(55,32,11,.20);

    transition:

        transform .15s ease,
        filter .15s ease;
}


#intro-start-button::after{

    content:"✦";

    position:absolute;

    right:20px;

    color:#e0b65b;

    font-size:16px;
}


#intro-start-button:hover::before{

    filter:brightness(1.12);

    transform:translateY(-2px);
}


#intro-start-button:active::before{

    transform:translateY(3px);
}


/* =========================================================
   GATE SCREEN
========================================================= */

#gate-screen{

    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:35px;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,247,215,.95) 0%,
            rgba(236,214,170,.98) 72%,
            rgba(186,145,82,1) 100%
        );

    overflow:hidden;

    z-index:99999;
}


/* =========================================================
   PARCHMENT
========================================================= */

.parchment{

    position:relative;

    width:min(1100px,92vw);

    height:min(720px,88vh);

    padding:70px 90px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(90,55,20,.025) 0 1px,
            transparent 1px 5px
        ),

        radial-gradient(
            ellipse at center,
            #f7e9c5 0%,
            #ead2a0 100%
        );

    border:2px solid #9b7138;

    box-shadow:

        0 18px 45px
        rgba(65,42,20,.30),

        inset
        0 0 45px
        rgba(100,65,20,.18),

        inset
        0 0 8px
        rgba(70,40,15,.35);

    overflow:hidden;
}


.parchment::before{

    content:"";

    position:absolute;

    inset:9px;

    border:
        1px solid
        rgba(102,70,32,.55);

    pointer-events:none;
}


.parchment::after{

    content:"";

    position:absolute;

    inset:20px;

    border:
        1px solid
        rgba(130,91,43,.25);

    pointer-events:none;
}


/* =========================================================
   CORNER ORNAMENTS
========================================================= */

.corner{

    position:absolute;

    width:80px;
    height:80px;

    color:#775124;

    opacity:.72;

    font-family:Georgia,serif;

    font-size:55px;

    line-height:1;

    pointer-events:none;
}

.corner.tl{
    top:24px;
    left:28px;
}

.corner.tr{
    top:24px;
    right:28px;
    transform:scaleX(-1);
}

.corner.bl{
    bottom:24px;
    left:28px;
    transform:scaleY(-1);
}

.corner.br{
    bottom:24px;
    right:28px;
    transform:scale(-1);
}


/* =========================================================
   TOP ORNAMENT
========================================================= */

.top-ornament{

    position:absolute;

    top:38px;
    left:50%;

    transform:translateX(-50%);

    width:360px;

    color:#765025;

    font-size:25px;

    letter-spacing:8px;

    opacity:.7;
}

.top-ornament::before,
.top-ornament::after{

    content:"──────";

    margin:0 10px;

    letter-spacing:0;
}


/* =========================================================
   COMPASS
========================================================= */

.compass{

    position:absolute;

    top:45px;
    right:55px;

    width:80px;
    height:80px;

    border:
        2px solid
        rgba(103,72,35,.45);

    border-radius:50%;

    opacity:.55;

    transform:rotate(12deg);
}

.compass::before{

    content:"";

    position:absolute;

    left:50%;
    top:8px;

    width:2px;
    height:62px;

    background:#765025;

    transform:
        translateX(-50%)
        rotate(45deg);
}

.compass::after{

    content:"N";

    position:absolute;

    top:-24px;
    left:50%;

    transform:translateX(-50%);

    font-family:Cinzel,serif;

    font-size:13px;

    font-weight:700;

    color:#765025;
}


/* =========================================================
   ANTIQUE KEY
========================================================= */

.key-wrapper{

    position:absolute;

    left:85px;
    top:50%;

    transform:
        translateY(-50%)
        rotate(-18deg);

    width:95px;
    height:245px;

    opacity:.9;

    filter:
        drop-shadow(
            4px 7px 4px
            rgba(55,30,10,.25)
        );

    pointer-events:none;
}


.key-head{

    position:absolute;

    top:0;
    left:12px;

    width:70px;
    height:70px;

    border:
        7px solid
        #9a6a24;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            #e1b95b 0%,
            #a8752b 55%,
            #704817 100%
        );

    box-shadow:

        inset
        3px 3px 5px
        rgba(255,220,120,.5),

        inset
        -4px -4px 7px
        rgba(50,25,5,.35);
}


.key-head::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:13px;
    height:25px;

    transform:
        translate(-50%,-50%);

    background:#5a3815;

    border-radius:
        50% 50% 45% 45%;
}


.key-shaft{

    position:absolute;

    top:57px;
    left:39px;

    width:18px;
    height:145px;

    background:

        linear-gradient(
            90deg,
            #684316,
            #d0a43d,
            #8b5c1e,
            #e1b754,
            #674116
        );

    border-radius:7px;

    box-shadow:

        inset
        1px 0
        rgba(255,240,170,.5),

        3px 3px 5px
        rgba(60,30,5,.25);
}


.key-teeth{

    position:absolute;

    bottom:5px;
    left:32px;

    width:38px;
    height:45px;

    background:

        linear-gradient(
            90deg,
            #704817 0%,
            #d0a13d 45%,
            #80531b 100%
        );

    clip-path:polygon(
        0 0,
        100% 0,
        100% 20%,
        65% 20%,
        65% 45%,
        100% 45%,
        100% 68%,
        55% 68%,
        55% 100%,
        0 100%
    );
}


/* =========================================================
   GATE TITLE
========================================================= */

.gate-title{

    position:relative;

    margin:0;

    color:#3f2818;

    font-family:
        "UnifrakturCook",
        "Times New Roman",
        serif;

    font-size:
        clamp(50px,6vw,78px);

    line-height:1;

    text-shadow:

        1px 1px 0 #d9b979,

        2px 2px 3px
        rgba(50,30,10,.20);

    z-index:2;
}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

    margin-top:22px;
    margin-bottom:38px;

    color:#5b4128;

    font-family:Georgia,serif;

    font-size:20px;

    font-style:italic;
}


/* =========================================================
   SEAL LABEL
========================================================= */

.seal-label{

    margin-bottom:12px;

    color:#3e2818;

    font-family:
        Cinzel,
        Georgia,
        serif;

    font-size:18px;

    font-weight:800;

    letter-spacing:3px;
}

.seal-label::before{
    content:"✦  ";
}

.seal-label::after{
    content:"  ✦";
}


/* =========================================================
   INPUT
========================================================= */

.seal-input{

    width:min(600px,70vw);

    height:68px;

    padding:
        0 24px;

    border:
        1px solid
        #a47a3c;

    border-radius:5px;

    outline:none;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(80,50,20,.025) 0 2px,
            transparent 2px 6px
        ),

        #f2dfb7;

    box-shadow:

        inset
        0 3px 8px
        rgba(70,40,10,.12),

        0 3px 5px
        rgba(70,40,10,.12);

    color:#392518;

    font-family:Georgia,serif;

    font-size:22px;
}

.seal-input::placeholder{

    color:#816c50;

    font-style:italic;
}

.seal-input:focus{

    border-color:#765025;

    box-shadow:

        0 0 0 3px
        rgba(157,113,56,.15),

        inset
        0 3px 8px
        rgba(70,40,10,.12);
}


/* =========================================================
   WOOD BUTTON
========================================================= */

.unlock-button{

    position:relative;

    margin-top:28px;

    min-width:300px;

    height:66px;

    padding:
        0 38px;

    border:
        3px solid
        #9c6b28;

    border-radius:10px;

    background:

        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.025) 0 3px,
            rgba(0,0,0,.025) 3px 8px
        ),

        linear-gradient(
            #714522,
            #542e16 50%,
            #3e210f
        );

    color:#f7e6bc;

    font-family:
        Cinzel,
        Georgia,
        serif;

    font-size:20px;

    font-weight:700;

    letter-spacing:1px;

    cursor:pointer;

    box-shadow:

        0 6px 0 #281509,

        0 9px 14px
        rgba(45,25,10,.35),

        inset
        0 1px 0
        rgba(255,210,120,.45);

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        filter .15s ease;

    z-index:5;
}


.unlock-button::before{

    content:"";

    position:absolute;

    inset:6px;

    border:
        1px solid
        rgba(218,166,73,.55);

    border-radius:5px;

    pointer-events:none;
}


.unlock-button:hover{

    filter:brightness(1.12);

    transform:translateY(-2px);

    box-shadow:

        0 8px 0 #281509,

        0 13px 18px
        rgba(45,25,10,.35),

        inset
        0 1px 0
        rgba(255,210,120,.55);
}


.unlock-button:active{

    transform:translateY(5px);

    box-shadow:

        0 1px 0 #281509,

        0 4px 8px
        rgba(45,25,10,.25);
}


/* =========================================================
   SPARKLES
========================================================= */

.sparkle{

    position:absolute;

    width:5px;
    height:5px;

    background:#e5b94e;

    border-radius:50%;

    box-shadow:

        0 0 6px #f4d47a,

        0 0 12px
        rgba(238,190,65,.7);

    animation:
        sparkle 2.5s
        ease-in-out
        infinite;

    pointer-events:none;
}


.sparkle::before,
.sparkle::after{

    content:"";

    position:absolute;

    background:#f3d47b;
}


.sparkle::before{

    width:2px;
    height:17px;

    left:2px;
    top:-6px;
}


.sparkle::after{

    width:17px;
    height:2px;

    left:-6px;
    top:2px;
}


@keyframes sparkle{

    0%,
    100%{
        opacity:.15;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.15);
    }
}


.s1{
    top:16%;
    left:21%;
}

.s2{
    top:24%;
    right:25%;
    animation-delay:.7s;
}

.s3{
    top:67%;
    left:18%;
    animation-delay:1.2s;
}

.s4{
    bottom:18%;
    right:22%;
    animation-delay:1.8s;
}

.s5{
    top:40%;
    right:15%;
    animation-delay:.3s;
}

.s6{
    bottom:25%;
    left:31%;
    animation-delay:1.5s;
}


/* =========================================================
   ERROR
========================================================= */

#error-message{

    min-height:24px;

    margin-top:14px;

    color:#8a281e;

    font-family:Georgia,serif;

    font-size:15px;

    font-weight:bold;
}


/* =========================================================
   HIDDEN
========================================================= */

.hidden{
    display:none !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .intro-mascot{

        width:75vw;

        max-height:65vh;
    }

    #intro-start-button{

        bottom:10%;

        width:210px;
    }


    #gate-screen{

        padding:15px;
    }


    .parchment{

        width:96vw;

        height:92vh;

        padding:
            55px 25px;
    }


    .gate-title{

        font-size:46px;
    }


    .subtitle{

        font-size:16px;

        max-width:80%;
    }


    .key-wrapper{

        left:18px;

        opacity:.35;

        transform:
            translateY(-50%)
            rotate(-18deg)
            scale(.7);
    }


    .compass{

        right:20px;

        transform:
            scale(.7)
            rotate(12deg);
    }


    .seal-input{

        width:85vw;

        max-width:600px;
    }


    .unlock-button{

        min-width:250px;

        font-size:17px;
    }

}


/* =========================================================
   SMALL HEIGHT
========================================================= */

@media(max-height:650px){

    .intro-mascot{

        max-height:58vh;
    }

    #intro-start-button{

        bottom:7%;

        height:50px;
    }


    .parchment{

        height:94vh;

        padding-top:45px;
    }


    .gate-title{

        font-size:42px;
    }


    .subtitle{

        margin-top:12px;

        margin-bottom:20px;
    }


    .seal-input{

        height:58px;
    }


    .unlock-button{

        height:58px;

        margin-top:18px;
    }

}

</style>
</head>

                    y="820"
                >
                    WESTERN COAST
                </text>

                <text
                    x="1090"
                    y="820"
                >
                    EASTERN KINGDOM
                </text>

            </g>

        </svg>

    </div>


    <!-- MASCOT -->

    <div class="intro-content">

        <img
            src="https://raw.githubusercontent.com/cachemeifyouscan/NPC---Need-Pamong-Context/main/mascot2.png"
            class="intro-mascot"
            alt="NPC Mascot"
        >


        <!-- CLICK HERE -->

        <button
            id="intro-start-button"
            type="button"
            aria-label="Click Here"
        ></button>

    </div>

</section>



<!-- =========================================================
     SCREEN 2 — THE GATE
========================================================= -->

<section
    id="gate-screen"
    class="hidden"
>


    <div class="parchment">


        <!-- CORNERS -->

        <div class="corner tl">
            ❧
        </div>

        <div class="corner tr">
            ❧
        </div>

        <div class="corner bl">
            ❧
        </div>

        <div class="corner br">
            ❧
        </div>


        <!-- TOP ORNAMENT -->

        <div class="top-ornament">
            ✦
        </div>


        <!-- COMPASS -->

        <div class="compass"></div>


        <!-- OLD KEY -->

        <div class="key-wrapper">

            <div class="key-head"></div>

            <div class="key-shaft"></div>

            <div class="key-teeth"></div>

        </div>


        <!-- SPARKLES -->

        <div class="sparkle s1"></div>
        <div class="sparkle s2"></div>
        <div class="sparkle s3"></div>
        <div class="sparkle s4"></div>
        <div class="sparkle s5"></div>
        <div class="sparkle s6"></div>


        <!-- TITLE -->

        <h1 class="gate-title">
            The Gate Awaits
        </h1>


        <!-- SUBTITLE -->

        <p class="subtitle">
            A sealed passage awaits those who know the way.
        </p>


        <!-- LABEL -->

        <div class="seal-label">
            ENTER YOUR SEAL
        </div>


        <!-- INPUT -->

        <input
            id="seal-input"
            class="seal-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Enter your seal..."
        >


        <!-- BUTTON -->

        <button
            id="unlock-button"
            class="unlock-button"
            type="button"
        >

            <span class="button-key">
                ⚿
            </span>

            UNLOCK GATE

        </button>


        <!-- ERROR -->

        <div
            id="error-message"
        ></div>

    </div>

</section>



<script>

/* =========================================================
   SCREEN REFERENCES
========================================================= */

const introScreen =
    document.getElementById(
        "intro-screen"
    );

const gateScreen =
    document.getElementById(
        "gate-screen"
    );


/* =========================================================
   INTRO → GATE
========================================================= */

const introButton =
    document.getElementById(
        "intro-start-button"
    );


introButton.addEventListener(
    "click",
    function(){

        /*
         * Fade out mascot screen
         */

        introScreen.classList.add(
            "hide"
        );


        /*
         * Show gate
         */

        gateScreen.classList.remove(
            "hidden"
        );


        /*
         * Wait until fade finishes
         * then focus input.
         */

        setTimeout(
            function(){

                document
                    .getElementById(
                        "seal-input"
                    )
                    .focus();

            },
            450
        );

    }
);


/* =========================================================
   ACCESS CODE
========================================================= */

const sealInput =
    document.getElementById(
        "seal-input"
    );

const unlockButton =
    document.getElementById(
        "unlock-button"
    );

const errorMessage =
    document.getElementById(
        "error-message"
    );


/*
   YOUR CODE
*/

const CORRECT_CODE =
    "SANAPATI";


/* =========================================================
   UNLOCK
========================================================= */

function unlockGate(){

    const enteredCode =
        sealInput
            .value
            .trim()
            .toUpperCase();


    /*
     * EMPTY
     */

    if(!enteredCode){

        errorMessage.textContent =
            "The seal remains silent...";

        sealInput.focus();

        return;
    }


    /*
     * CORRECT
     */

    if(
        enteredCode ===
        CORRECT_CODE
    ){

        errorMessage.textContent =
            "";


        unlockButton.textContent =
            "✦ GATE UNLOCKED ✦";


        unlockButton.style.pointerEvents =
            "none";


        unlockButton.style.opacity =
            ".75";


        /*
         * Here you can connect
         * the next screen/game logic.
         *
         * For now the gate stays
         * on screen.
         */

        setTimeout(
            function(){

                console.log(
                    "Gate unlocked."
                );

            },
            500
        );


        return;
    }


    /*
     * WRONG CODE
     */

    errorMessage.textContent =
        "The seal bears no such mark.";


    sealInput.value =
        "";


    sealInput.focus();

}


/* =========================================================
   BUTTON
========================================================= */

unlockButton.addEventListener(
    "click",
    unlockGate
);


/* =========================================================
   ENTER KEY
========================================================= */

sealInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            unlockGate();

        }

    }
);

</script>

</body>
</html>
