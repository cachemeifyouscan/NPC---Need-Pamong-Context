<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supabase Team A Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at center, #fff8e5, #ead4a2);
            color: #3d2818;
        }

        .container {
            width: min(900px, 100%);
            margin: auto;
        }

        h1 {
            font-family: Georgia, serif;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #76552d;
            margin-bottom: 25px;
        }

        button {
            padding: 13px 24px;
            border: 2px solid #573516;
            border-radius: 4px;
            background: linear-gradient(
                #80532b,
                #633d20
            );
            color: #f5dfb1;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.1);
        }

        #status {
            margin: 20px 0;
            padding: 16px;
            background: rgba(255, 248, 230, .9);
            border: 1px solid #b18a51;
            line-height: 1.6;
        }

        .success {
            border-color: #65703c !important;
        }

        .error {
            border-color: #9a4738 !important;
        }

        .person {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 18px;
            margin: 12px 0;
            background: rgba(255, 248, 230, .9);
            border: 1px solid #b18a51;
            box-shadow: 0 4px 12px rgba(60, 35, 10, .1);
        }

        .person-photo {
            width: 110px;
            height: 130px;
            flex-shrink: 0;
            background: #d9c091;
            border: 2px solid #87602d;
            overflow: hidden;
        }

        .person-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .no-photo {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #76552d;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .person h3 {
            margin: 0 0 7px;
            font-family: Georgia, serif;
            font-size: 22px;
        }

        .person p {
            margin: 5px 0;
        }

        .person small {
            color: #76552d;
        }

        pre {
            margin-top: 20px;
            padding: 15px;
            background: #21180f;
            color: #f2dfb5;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
            border-radius: 4px;
        }

        code {
            background: rgba(100, 65, 25, .12);
            padding: 2px 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Supabase — Team A Test</h1>

    <div class="subtitle">
        Testing REST API → Pengasuh → Team A
    </div>

    <button id="test-button" type="button">
        TEST TEAM A
    </button>

    <div id="status">
        Belum melakukan test.
    </div>

    <div id="result"></div>

</div>


<script>

    // =========================================================
    // SUPABASE CONFIG
    // =========================================================

    const SUPABASE_URL =
        "https://wfrhomvhehsglmohshxl.supabase.co";

    const SUPABASE_API_URL =
        `${SUPABASE_URL}/rest/v1/`;

    const SUPABASE_PUBLIC_KEY =
        "sb_publishable_9sG5BElCAe9t99f0kwSkCw_RUbvl4x6";


    // =========================================================
    // ELEMENTS
    // =========================================================

    const testButton =
        document.getElementById("test-button");

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");


    // =========================================================
    // TEST
    // =========================================================

    async function testSupabase() {

        status.className = "";
        status.innerHTML =
            "⏳ Menghubungkan ke Supabase...";

        result.innerHTML = "";

        /*
         * REST API:
         *
         * /rest/v1/Pengasuh
         *
         * Kita hanya mengambil:
         * id
         * nama
         * panggilan
         * foto
         *
         * tim = A hanya digunakan sebagai
         * filter belakang layar.
         */

        const url =
            `${SUPABASE_API_URL}` +
            `Pengasuh` +
            `?select=id,nama,panggilan,foto` +
            `&tim=eq.A`;


        console.log(
            "REQUEST URL:",
            url
        );


        try {

            // =================================================
            // IMPORTANT:
            // HANYA APIKEY
            //
            // Tidak menggunakan:
            // Authorization: Bearer ...
            // =================================================

            const response =
                await fetch(url, {

                    method: "GET",

                    headers: {
                        "apikey":
                            SUPABASE_PUBLIC_KEY
                    }

                });


            console.log(
                "HTTP STATUS:",
                response.status
            );


            const rawText =
                await response.text();


            console.log(
                "RAW RESPONSE:",
                rawText
            );


            // =================================================
            // ERROR
            // =================================================

            if (!response.ok) {

                status.className = "error";

                status.innerHTML = `
                    ❌ <strong>Supabase Error</strong><br><br>

                    HTTP Status:
                    <strong>${response.status}</strong>
                `;

                result.innerHTML = `
                    <pre>${escapeHTML(rawText)}</pre>
                `;

                return;
            }


            // =================================================
            // SUCCESS
            // =================================================

            let data;

            try {

                data = JSON.parse(rawText);

            } catch (parseError) {

                status.className = "error";

                status.innerHTML = `
                    ❌ Supabase mengembalikan response
                    yang bukan JSON.
                `;

                result.innerHTML = `
                    <pre>${escapeHTML(rawText)}</pre>
                `;

                return;
            }


            // =================================================
            // SUCCESS MESSAGE
            // =================================================

            status.className = "success";

            status.innerHTML = `
                ✅ <strong>SUPABASE BERHASIL!</strong><br><br>

                HTTP Status:
                <strong>${response.status}</strong><br>

                Data Team A ditemukan:
                <strong>${data.length}</strong> orang.
            `;


            // =================================================
            // NO DATA
            // =================================================

            if (data.length === 0) {

                result.innerHTML = `
                    <div class="person">
                        <div>
                            Query berhasil,
                            tetapi tidak ada data dengan
                            <code>tim = A</code>.
                        </div>
                    </div>
                `;

                return;
            }


            // =================================================
            // DISPLAY DATA
            // =================================================

            result.innerHTML =
                data.map(person => {

                    const photo =
                        person.foto
                        ? `
                            <img
                                src="${escapeHTML(person.foto)}"
                                alt="Foto Pamong"
                                onerror="this.parentElement.innerHTML =
                                    '<div class=&quot;no-photo&quot;>
                                        PHOTO BROKEN
                                    </div>'"
                            >
                          `
                        : `
                            <div class="no-photo">
                                NO PHOTO
                            </div>
                          `;


                    return `

                        <div class="person">

                            <div class="person-photo">
                                ${photo}
                            </div>

                            <div>

                                <h3>
                                    ${escapeHTML(
                                        person.nama
                                    )}
                                </h3>

                                <p>
                                    <strong>
                                        Panggilan:
                                    </strong>

                                    ${escapeHTML(
                                        person.panggilan || "-"
                                    )}
                                </p>

                                <small>
                                    ID:
                                    ${escapeHTML(
                                        person.id
                                    )}
                                </small>

                                <br>

                                <small>
                                    Foto:
                                    ${escapeHTML(
                                        person.foto || "-"
                                    )}
                                </small>

                            </div>

                        </div>

                    `;

                }).join("");

        }


        // =====================================================
        // CATCH NETWORK ERROR
        // =====================================================

        catch (error) {

            console.error(
                "FETCH ERROR:",
                error
            );

            status.className = "error";

            status.innerHTML = `
                ❌ <strong>Network / JavaScript Error</strong>
            `;

            result.innerHTML = `
                <pre>${escapeHTML(
                    error.message
                )}</pre>
            `;

        }

    }


    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // =========================================================
    // BUTTON
    // =========================================================

    testButton.addEventListener(
        "click",
        testSupabase
    );


</script>

</body>
</html>
