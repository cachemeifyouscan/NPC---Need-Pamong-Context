<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Gate Awaits</title>

<!-- Medieval / Old Manuscript Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


/* =========================================================
   MAIN SCREEN
========================================================= */

#gate-screen {

    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 35px;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,247,215,0.95) 0%,
            rgba(236,214,170,0.98) 72%,
            rgba(186,145,82,1) 100%
        );

    z-index: 99999;

    font-family: Georgia, "Times New Roman", serif;

    overflow: hidden;
}


/* =========================================================
   OLD PARCHMENT
========================================================= */

.parchment {

    position: relative;

    width: min(1100px, 92vw);
    height: min(720px, 88vh);

    padding: 70px 90px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:

        /* parchment fibers */
        repeating-linear-gradient(
            0deg,
            rgba(90,55,20,0.025) 0px,
            rgba(90,55,20,0.025) 1px,
            transparent 1px,
            transparent 5px
        ),

        radial-gradient(
            ellipse at center,
            #f7e9c5 0%,
            #ead2a0 100%
        );

    border: 2px solid #9b7138;

    box-shadow:
        0 18px 45px rgba(65,42,20,0.30),
        inset 0 0 45px rgba(100,65,20,0.18),
        inset 0 0 8px rgba(70,40,15,0.35);

    overflow: hidden;
}


/* =========================================================
   PARCHMENT AGED EDGES
========================================================= */

.parchment::before {

    content: "";

    position: absolute;
    inset: 9px;

    border: 1px solid rgba(102,70,32,0.55);

    pointer-events: none;
}


.parchment::after {

    content: "";

    position: absolute;
    inset: 20px;

    border: 1px solid rgba(130,91,43,0.25);

    pointer-events: none;
}


/* =========================================================
   ORNAMENTS
========================================================= */

.corner {

    position: absolute;

    width: 80px;
    height: 80px;

    color: #775124;

    opacity: 0.72;

    font-family: Georgia, serif;

    font-size: 55px;

    line-height: 1;

    pointer-events: none;
}

.corner.tl {
    top: 24px;
    left: 28px;
}

.corner.tr {
    top: 24px;
    right: 28px;
    transform: scaleX(-1);
}

.corner.bl {
    bottom: 24px;
    left: 28px;
    transform: scaleY(-1);
}

.corner.br {
    bottom: 24px;
    right: 28px;
    transform: scale(-1);
}


/* =========================================================
   TOP ORNAMENT
========================================================= */

.top-ornament {

    position: absolute;

    top: 38px;
    left: 50%;

    transform: translateX(-50%);

    width: 360px;

    color: #765025;

    font-size: 25px;

    letter-spacing: 8px;

    opacity: 0.7;
}

.top-ornament::before,
.top-ornament::after {

    content: "──────";

    margin: 0 10px;

    letter-spacing: 0;
}


/* =========================================================
   COMPASS
========================================================= */

.compass {

    position: absolute;

    top: 45px;
    right: 55px;

    width: 80px;
    height: 80px;

    border: 2px solid rgba(103,72,35,0.45);

    border-radius: 50%;

    opacity: 0.55;

    transform: rotate(12deg);
}

.compass::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 8px;

    width: 2px;
    height: 62px;

    background: #765025;

    transform: translateX(-50%) rotate(45deg);
}

.compass::after {

    content: "N";

    position: absolute;

    top: -24px;
    left: 50%;

    transform: translateX(-50%);

    font-family: Cinzel, serif;

    font-size: 13px;

    font-weight: 700;

    color: #765025;
}


/* =========================================================
   TITLE
========================================================= */

.gate-title {

    position: relative;

    margin: 0;

    color: #3f2818;

    font-family: "UnifrakturCook", "Times New Roman", serif;

    font-size: clamp(50px, 6vw, 78px);

    line-height: 1;

    letter-spacing: 1px;

    text-shadow:
        1px 1px 0 #d9b979,
        2px 2px 3px rgba(50,30,10,0.20);

    z-index: 2;
}


/* =========================================================
   KEY
========================================================= */

.key-wrapper {

    position: absolute;

    left: 85px;
    top: 50%;

    transform:
        translateY(-50%)
        rotate(-18deg);

    width: 95px;
    height: 245px;

    opacity: 0.9;

    filter:
        drop-shadow(4px 7px 4px rgba(55,30,10,0.25));

    pointer-events: none;
}


/* key head */

.key-head {

    position: absolute;

    top: 0;
    left: 12px;

    width: 70px;
    height: 70px;

    border: 7px solid #9a6a24;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #e1b95b 0%,
            #a8752b 55%,
            #704817 100%
        );

    box-shadow:
        inset 3px 3px 5px rgba(255,220,120,0.5),
        inset -4px -4px 7px rgba(50,25,5,0.35);
}


/* key hole */

.key-head::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 13px;
    height: 25px;

    transform: translate(-50%, -50%);

    background: #5a3815;

    border-radius: 50% 50% 45% 45%;
}


/* key shaft */

.key-shaft {

    position: absolute;

    top: 57px;
    left: 39px;

    width: 18px;
    height: 145px;

    background:
        linear-gradient(
            90deg,
            #684316,
            #d0a43d,
            #8b5c1e,
            #e1b754,
            #674116
        );

    border-radius: 7px;

    box-shadow:
        inset 1px 0 rgba(255,240,170,0.5),
        3px 3px 5px rgba(60,30,5,0.25);
}


/* key teeth */

.key-teeth {

    position: absolute;

    bottom: 5px;
    left: 32px;

    width: 38px;
    height: 45px;

    background:
        linear-gradient(
            90deg,
            #704817 0%,
            #d0a13d 45%,
            #80531b 100%
        );

    clip-path: polygon(
        0 0,
        100% 0,
        100% 20%,
        65% 20%,
        65% 45%,
        100% 45%,
        100% 68%,
        55% 68%,
        55% 100%,
        0 100%
    );
}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {

    margin-top: 22px;
    margin-bottom: 38px;

    color: #5b4128;

    font-family: Georgia, serif;

    font-size: 20px;

    font-style: italic;

    letter-spacing: 0.4px;
}


/* =========================================================
   LABEL
========================================================= */

.seal-label {

    margin-bottom: 12px;

    color: #3e2818;

    font-family: Cinzel, Georgia, serif;

    font-size: 18px;

    font-weight: 800;

    letter-spacing: 3px;
}

.seal-label::before {
    content: "✦  ";
}

.seal-label::after {
    content: "  ✦";
}


/* =========================================================
   INPUT
========================================================= */

.seal-input {

    width: min(600px, 70vw);

    height: 68px;

    padding: 0 24px;

    border: 1px solid #a47a3c;

    border-radius: 5px;

    outline: none;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(80,50,20,0.025) 0px,
            rgba(80,50,20,0.025) 2px,
            transparent 2px,
            transparent 6px
        ),

        #f2dfb7;

    box-shadow:
        inset 0 3px 8px rgba(70,40,10,0.12),
        0 3px 5px rgba(70,40,10,0.12);

    color: #392518;

    font-family: Georgia, serif;

    font-size: 22px;
}

.seal-input::placeholder {
    color: #816c50;
    font-style: italic;
}

.seal-input:focus {

    border-color: #765025;

    box-shadow:
        0 0 0 3px rgba(157,113,56,0.15),
        inset 0 3px 8px rgba(70,40,10,0.12);
}


/* =========================================================
   WOOD BUTTON
========================================================= */

.unlock-button {

    position: relative;

    margin-top: 28px;

    min-width: 300px;

    height: 66px;

    padding: 0 38px;

    border: 3px solid #9c6b28;

    border-radius: 10px;

    background:

        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 0px,
            rgba(255,255,255,0.025) 3px,
            rgba(0,0,0,0.025) 3px,
            rgba(0,0,0,0.025) 8px
        ),

        linear-gradient(
            180deg,
            #714522 0%,
            #542e16 50%,
            #3e210f 100%
        );

    color: #f7e6bc;

    font-family: Cinzel, Georgia, serif;

    font-size: 20px;

    font-weight: 700;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 6px 0 #281509,
        0 9px 14px rgba(45,25,10,0.35),
        inset 0 1px 0 rgba(255,210,120,0.45);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        filter 0.15s ease;

    z-index: 5;
}


/* button inner border */

.unlock-button::before {

    content: "";

    position: absolute;

    inset: 6px;

    border: 1px solid rgba(218,166,73,0.55);

    border-radius: 5px;

    pointer-events: none;
}


/* button hover */

.unlock-button:hover {

    filter: brightness(1.12);

    transform: translateY(-2px);

    box-shadow:
        0 8px 0 #281509,
        0 13px 18px rgba(45,25,10,0.35),
        inset 0 1px 0 rgba(255,210,120,0.55);
}


/* button click */

.unlock-button:active {

    transform: translateY(5px);

    box-shadow:
        0 1px 0 #281509,
        0 4px 8px rgba(45,25,10,0.25);
}


/* =========================================================
   KEY ICON IN BUTTON
========================================================= */

.button-key {

    display: inline-block;

    margin-right: 10px;

    font-size: 23px;

    color: #e4b64f;

    transform: rotate(-25deg);

    text-shadow:
        1px 1px 2px #1e1007;
}


/* =========================================================
   SPARKLES
========================================================= */

.sparkle {

    position: absolute;

    width: 5px;
    height: 5px;

    background: #e5b94e;

    border-radius: 50%;

    box-shadow:
        0 0 6px #f4d47a,
        0 0 12px rgba(238,190,65,0.7);

    animation: sparkle 2.5s ease-in-out infinite;

    pointer-events: none;
}


.sparkle::before,
.sparkle::after {

    content: "";

    position: absolute;

    background: #f3d47b;
}


.sparkle::before {

    width: 2px;
    height: 17px;

    left: 2px;
    top: -6px;
}


.sparkle::after {

    width: 17px;
    height: 2px;

    left: -6px;
    top: 2px;
}


@keyframes sparkle {

    0%,
    100% {
        opacity: 0.15;
        transform: scale(0.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}


/* positions */

.s1 {
    top: 16%;
    left: 21%;
}

.s2 {
    top: 24%;
    right: 25%;
    animation-delay: 0.7s;
}

.s3 {
    top: 67%;
    left: 18%;
    animation-delay: 1.2s;
}

.s4 {
    bottom: 18%;
    right: 22%;
    animation-delay: 1.8s;
}

.s5 {
    top: 40%;
    right: 15%;
    animation-delay: 0.3s;
}

.s6 {
    bottom: 25%;
    left: 31%;
    animation-delay: 1.5s;
}


/* =========================================================
   SUCCESS STATE
========================================================= */

.gate-success {

    display: none;

    position: absolute;

    inset: 0;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: #ead3a2;

    z-index: 20;

    color: #3d2615;

    text-align: center;
}


.gate-success h2 {

    margin: 0 0 15px;

    font-family: "UnifrakturCook", serif;

    font-size: 64px;
}


.gate-success p {

    font-family: Georgia, serif;

    font-size: 20px;
}


/* =========================================================
   ERROR
========================================================= */

#error-message {

    min-height: 24px;

    margin-top: 14px;

    color: #8a281e;

    font-family: Georgia, serif;

    font-size: 15px;

    font-weight: bold;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    #gate-screen {
        padding: 15px;
    }

    .parchment {

        width: 96vw;
        height: 92vh;

        padding: 55px 25px;
    }

    .gate-title {
        font-size: 46px;
    }

    .subtitle {
        font-size: 16px;
        max-width: 80%;
    }

    .key-wrapper {
        left: 18px;
        opacity: 0.35;
        transform:
            translateY(-50%)
            rotate(-18deg)
            scale(0.7);
    }

    .compass {
        right: 20px;
        transform: scale(0.7) rotate(12deg);
    }

    .seal-input {
        width: 85vw;
        max-width: 600px;
    }

    .unlock-button {
        min-width: 250px;
        font-size: 17px;
    }

}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media (max-height: 650px) {

    .parchment {
        height: 94vh;
        padding-top: 45px;
    }

    .gate-title {
        font-size: 42px;
    }

    .subtitle {
        margin-top: 12px;
        margin-bottom: 20px;
    }

    .seal-input {
        height: 58px;
    }

    .unlock-button {
        height: 58px;
        margin-top: 18px;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     GATE SCREEN
========================================================= -->

<div id="gate-screen">

    <div class="parchment">


        <!-- CORNER ORNAMENTS -->

        <div class="corner tl">❧</div>
        <div class="corner tr">❧</div>
        <div class="corner bl">❧</div>
        <div class="corner br">❧</div>


        <!-- TOP DECORATION -->

        <div class="top-ornament">
            ✦
        </div>


        <!-- COMPASS -->

        <div class="compass"></div>


        <!-- ANTIQUE KEY -->

        <div class="key-wrapper">

            <div class="key-head"></div>

            <div class="key-shaft"></div>

            <div class="key-teeth"></div>

        </div>


        <!-- SPARKLES -->

        <div class="sparkle s1"></div>
        <div class="sparkle s2"></div>
        <div class="sparkle s3"></div>
        <div class="sparkle s4"></div>
        <div class="sparkle s5"></div>
        <div class="sparkle s6"></div>


        <!-- MAIN CONTENT -->

        <h1 class="gate-title">
            The Gate Awaits
        </h1>


        <p class="subtitle">
            A sealed passage awaits those who know the way.
        </p>


        <div class="seal-label">
            ENTER YOUR SEAL
        </div>


        <input
            id="seal-input"
            class="seal-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Enter your seal..."
        >


        <button
            id="unlock-button"
            class="unlock-button"
            type="button"
        >

            <span class="button-key">⚿</span>

            UNLOCK GATE

        </button>


        <div id="error-message"></div>


        <!-- SUCCESS -->

        <div
            id="gate-success"
            class="gate-success"
        >

            <h2>
                The Gate Opens
            </h2>

            <p>
                The seal has been recognized.
            </p>

        </div>


    </div>

</div>



<script>

/* =========================================================
   GATE LOGIC
========================================================= */

const sealInput =
    document.getElementById("seal-input");

const unlockButton =
    document.getElementById("unlock-button");

const errorMessage =
    document.getElementById("error-message");

const gateSuccess =
    document.getElementById("gate-success");


/*
    YOUR ACCESS CODE
    =================

    SANAPATI
*/

const CORRECT_CODE = "SANAPATI";


function unlockGate() {

    const enteredCode =
        sealInput.value
            .trim()
            .toUpperCase();


    /* Empty input */

    if (!enteredCode) {

        errorMessage.textContent =
            "The seal remains silent...";

        sealInput.focus();

        return;
    }


    /* Correct code */

    if (enteredCode === CORRECT_CODE) {

        errorMessage.textContent = "";

        gateSuccess.style.display = "flex";


        /*
            Kalau flow game lo punya fungsi
            setelah gate terbuka, bisa dipanggil
            di sini.
        */

        setTimeout(() => {

            /*
              CONTOH:

              document.getElementById("next-section")
                  .scrollIntoView();

            */

            gateSuccess.style.display = "none";

            /*
              HAPUS BARIS DI ATAS kalau setelah
              unlock memang mau pindah ke section
              berikutnya menggunakan logic game lo.
            */

        }, 1800);

    }


    /* Wrong code */

    else {

        errorMessage.textContent =
            "The seal bears no such mark.";

        sealInput.value = "";

        sealInput.focus();
    }

}


/* Button */

unlockButton.addEventListener(
    "click",
    unlockGate
);


/* Enter key */

sealInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            unlockGate();
        }

    }
);

</script>

</body>
</html>
