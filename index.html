<!-- =====================================================
     OPENING SCREEN
===================================================== -->

<div id="intro-screen">

    <!-- ================= MAP BACKGROUND ================= -->

    <div class="map-decoration">

                x="20"
                y="20"
                width="1360"
                height="860"

                stroke-width="3"
                opacity="0.55"

                y="65"
                text-anchor="middle"

                SANAPATI LAND

            <!-- WESTERN WOODS -->

            <text
                x="175"
                y="180"

            <!-- NORTHERN PEAKS -->

            <text
                x="1080"
                y="180"
                class="map-label"
            >
                NORTHERN PEAKS
            </text>


            <!-- NORTH WEST -->

            <text

                NORTH WEST
            </text>


            <!-- EAST -->

            <text
                x="1270"
                y="450"

                EAST
            </text>


            <!-- SOUTH -->

            <text

                C 1060 350,
                  1140 440,
                  1060 530

                C 980 620,
                  1050 710,
                  970 900

                  530 570

            <g class="map-castle">

                    L195 400

                <circle
                    r="67"
                />

                <path
                    d="
                    M0 -75
                    L15 0
                    L0 75
                    L-15 0
                    Z
                    "
                />

                <path
                    d="
                    M-75 0
                    L0 15
                    L75 0
                    L0 -15
                    Z

                />

                <circle
                    r="7"
                />

                <text
                    x="0"
                    y="-95"
                    text-anchor="middle"

                    N
                </text>

                <text
                    x="0"
                    y="112"
                    text-anchor="middle"

                    S
                </text>

                <text
                    x="-100"
                    y="6"
                    text-anchor="middle"

                    W
                </text>

                <text
                    x="100"
                    y="6"
